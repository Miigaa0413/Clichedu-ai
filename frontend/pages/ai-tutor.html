
<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clichedu AI — AI Багш</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body class="app-body">

    <!-- ================================
         SIDEBAR
    ================================= -->

    <aside class="sidebar">

        <div class="logo">
            <span class="logo-icon">C</span>
            <span>Clichedu</span>
        </div>


        <nav class="sidebar-menu">

            <a href="../index.html">
                <span>🏠</span>
                <span>Нүүр</span>
            </a>

            <a href="#" class="active">
                <span>🤖</span>
                <span>AI Багш</span>
            </a>

            <a href="#">
                <span>📚</span>
                <span>Хичээлүүд</span>
            </a>

            <a href="#">
                <span>📝</span>
                <span>Даалгавар</span>
            </a>

            <a href="#">
                <span>📊</span>
                <span>Миний ахиц</span>
            </a>

        </nav>


        <div class="sidebar-bottom">

            <a href="#">
                <span>⚙️</span>
                <span>Тохиргоо</span>
            </a>

            <a href="#">
                <span>👤</span>
                <span>Профайл</span>
            </a>

        </div>

    </aside>



    <!-- ================================
         MAIN APP
    ================================= -->

    <main class="chat-app">


        <!-- HEADER -->

        <header class="chat-topbar">

            <div class="chat-title">

                <div class="mini-ai-icon">
                    ✦
                </div>

                <div>

                    <h2>
                        Clichedu AI
                    </h2>

                    <span>
                        Таны хувийн AI багш
                    </span>

                </div>

            </div>


            <div class="ai-status">

                <span class="status-dot"></span>

                Онлайн

            </div>

        </header>



        <!-- ================================
             CHAT AREA
        ================================= -->

        <section
            class="chat-area"
            id="chatArea"
        >

            <!-- WELCOME -->

            <div class="welcome">

                <div class="big-ai-icon">
                    ✦
                </div>


                <h1>
                    Сайн уу! 👋
                </h1>


                <p>
                    Би Clichedu AI.
                    Өнөөдөр юу сурах вэ?
                </p>


                <div class="quick-actions">

                    <button type="button">
                        📐 Математик
                    </button>

                    <button type="button">
                        💻 Программчлал
                    </button>

                    <button type="button">
                        ⚛ Физик
                    </button>

                    <button type="button">
                        🧪 Хими
                    </button>

                </div>

            </div>

        </section>



        <!-- ================================
             INPUT AREA
        ================================= -->

        <div class="chat-bottom">

            <div class="message-input">

                <textarea
                    id="messageInput"
                    placeholder="Clichedu AI-д асуултаа бичнэ үү..."
                    rows="1"
                    autocomplete="off"
                ></textarea>


                <button
                    id="sendMessage"
                    type="button"
                    aria-label="Илгээх"
                >
                    ➤
                </button>

            </div>


            <small>
                Clichedu AI алдаа гаргаж болзошгүй.
                Чухал мэдээллийг шалгана уу.
            </small>

        </div>

    </main>



    <!-- JAVASCRIPT -->

    <script src="../script.js"></script>

</body>

</html>
